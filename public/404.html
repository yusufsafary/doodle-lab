<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Doodle Lab AI</title>
    <script>
      // GitHub Pages SPA fallback: bounce deep links back to index.html with
      // the path encoded in the query string; index.html restores it.
      // pathSegmentsToKeep = 1 keeps the /doodle-lab/ project subpath.
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') +
          '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
